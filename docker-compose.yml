# FinalTable - production shape.
# The FinalTable-dev clone keeps its own copy of this file with a different
# container name and port; that copy is never mirrored from here.
services:
  finaltable:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: finaltable
    restart: unless-stopped
    ports:
      # Loopback only. A reverse proxy fronts this; the port is here for
      # debugging over an SSH tunnel.
      - "127.0.0.1:${PORT_PUBLISH:-8091}:2026"
    volumes:
      - finaltable-data:/app/data
    environment:
      - PORT=2026
      - HOST=0.0.0.0
      - SAVE_DIR=/app/data
      - LOG_LEVEL=info
      # Precomputed preflop equity table. Costs startup time and memory;
      # turn off on a constrained host and the bots fall back to Monte Carlo.
      - PREFLOP_TABLE=${PREFLOP_TABLE:-on}
      - PREFLOP_SIMS=${PREFLOP_SIMS:-10000}
      # Bot "thinking" time before each action, in ms (a random value in this
      # range, then divided by the table speed multiplier). Raise to slow the
      # bots down further.
      - NPC_DELAY_MIN=${NPC_DELAY_MIN:-2600}
      - NPC_DELAY_MAX=${NPC_DELAY_MAX:-5200}
    # This runs as a co-tenant beside other stacks on a 1 vCPU host. Explicit
    # limits so a runaway tournament process cannot starve its neighbours.
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2026/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  finaltable-data:
